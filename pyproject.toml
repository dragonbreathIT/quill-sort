[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "quill-sort"
version         = "7.5.2"
description     = "Adaptive sorting that auto-dispatches to the fastest available backend (compiled, GPU, parallel) with a guaranteed numpy/Timsort fallback; Quill.UltraSort engine for billion-element integer workloads."
readme          = "README.md"
license         = { text = "MIT" }
authors         = [{ name = "Isaiah Tucker" }]
requires-python = ">=3.8"

keywords = [
  "sorting", "sort", "algorithm", "radix sort", "parallel sort",
  "fast sort", "high performance", "numpy", "gpu", "cupy", "polars"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
]

# Core install has ZERO required dependencies — Quill is always correct with the
# stdlib alone (Timsort) and faster with numpy. Speed backends are opt-in extras.
dependencies = []

# NOTE: the optional C extensions (``quill._listconv_ext``, ``quill._counting_ext``)
# are compiled automatically by setup.py when a C toolchain is available at
# install time — there is no separate ``pip install quill-sort[c-ext]`` extra
# (such a name would be misleading since the build is auto-detected, not a
# user-selected dependency set). Installs without a C toolchain transparently
# fall back to the pure-Python paths.
[project.optional-dependencies]
# numpy + accurate RAM sensing — the baseline fast path.
fast    = ["numpy>=1.21", "psutil>=5.9"]
# polars backend: a no-compile, cross-platform multi-threaded parallel sort
# (~2-2.7x vs np.sort on the array path). The recommended "fast for everyone".
polars  = ["numpy>=1.21", "polars>=0.20"]
# GPU backend via CuPy (NVIDIA only; pick the wheel matching your CUDA major).
gpu     = ["numpy>=1.21", "cupy-cuda12x>=13; platform_system!='Darwin'"]
pandas  = ["numpy>=1.21", "pandas>=1.3"]
all     = ["numpy>=1.21", "pandas>=1.3", "psutil>=5.9", "polars>=0.20"]
dev     = [
  "pytest>=7.0",
  "pytest-timeout>=2.1",
  "hypothesis>=6.0",
]

[project.scripts]
quill = "quill.__main__:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["quill*"]
exclude = ["scratch", "scratch.*", "tests", "tests.*", "build", "build.*", "rustext", "rustext.*", "companions", "companions.*"]

[tool.setuptools.package-data]
# Ship the C/C++ sources so a source build (sdist, or the pure-Python wheel on a
# box with a toolchain) can recompile the optional extensions via setup.py:
#   *.c                 -> the numpy-backed list-conv / counting-sort exts
#   _native_src/*.{cpp,hpp} -> the bundled CPU backends (quill._native)
quill = ["py.typed", "*.c", "_native_src/*.cpp", "_native_src/*.hpp", "_native_src/*.c", "_native_src/*.h"]

# The compiled CPU fast-sort backends (rust_voracious/rust_parallel_radix/ips4o/
# numa/simd_companion) are now FOLDED IN as a single bundled extension,
# ``quill._native`` (built from quill/_native_src/ — see setup.py). They ship
# inside quill-sort's per-platform binary wheels (built by cibuildwheel below),
# so ``pip install quill-sort`` gets the fast path with no extra installs. Where
# no binary wheel matches, the sdist recompiles it (needs a C++ compiler), and
# if that fails the pure-Python paths take over — install never fails. The old
# standalone quill-fastsort* companions are still probed as a fallback for
# existing installs. GPU (cupy) stays an opt-in ``[gpu]`` extra.

# ── cibuildwheel: per-platform binary wheels carrying quill._native ──────────
[tool.cibuildwheel]
# cibuildwheel 4.x requires Python >= 3.9. cp38 (EOL Oct 2024) still installs via
# the sdist / pure-Python wheel; it just gets no prebuilt binary wheel.
# cp314 (Python 3.14, stable Oct 2025) needs cibuildwheel >= 3.x — the CI action
# is pinned to v4.1.0 (see .github/workflows/quill-sort-wheels.yml). The glob
# ``cp314-*`` matches the standard build only, NOT the free-threaded ``cp314t-*``.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip 32-bit (i686 Linux + win32). PyPy needs no explicit skip on cibuildwheel
# 4.x — it isn't enabled by default there, and a leftover `pp*` selector only
# warns ("matches a group that wasn't enabled").
skip  = "*_i686 *-win32"
# QUILL_FORCE_C_EXT makes a failed native build FAIL the wheel (a missing backend
# in a binary wheel is a bug); the sdist path stays graceful (optional=True).
environment = { QUILL_FORCE_C_EXT = "1" }
# Prove the shipped wheel actually carries the native backend before publishing.
test-requires = "numpy"
# NB: dtype=np.int64 inside randint — on Windows numpy's default int is int32, so
# 2**40 would overflow before .astype ever runs.
test-command = 'python -c "import quill, numpy as np; from quill import _native; a=np.random.randint(0,2**40,300000,dtype=np.int64); assert (quill.sort_array(a.copy())==np.sort(a)).all(); assert \"rust_parallel_radix\" in quill.available_backends()"'

[tool.cibuildwheel.linux]
# numpy 2.x dropped manylinux2014 (its wheels are manylinux_2_28), so the test
# step would source-build numpy in the old image and fail on its ancient gcc.
# manylinux_2_28 ships a modern gcc AND matches numpy's wheels.
manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { QUILL_FORCE_C_EXT = "1", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (parallel, large data)",
]
addopts = "-v --tb=short --timeout=120"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
